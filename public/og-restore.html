<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden; position:relative;
    font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#312e81 0%,#4f46e5 52%,#7c3aed 100%);
    color:#fff;
  }
  .glow1 { position:absolute; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%); top:-200px; right:-140px; }
  .glow2 { position:absolute; width:460px; height:460px; border-radius:50%;
    background:radial-gradient(circle,rgba(165,180,252,.28),transparent 70%); bottom:-180px; left:-120px; }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:48px 48px; }
  .brand { position:absolute; top:46px; left:64px; display:flex; align-items:center; gap:14px; }
  .brand .mark { width:46px; height:46px; border-radius:13px; background:#fff; color:#4f46e5;
    display:grid; place-items:center; font-size:27px; font-weight:800; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .brand .name { font-size:23px; font-weight:700; }
  .brand .site { font-size:23px; font-weight:600; color:#c7d2fe; }
  .main { position:absolute; left:64px; top:168px; width:600px; }
  .eyebrow { font-size:15px; font-weight:800; letter-spacing:.18em; color:#c7d2fe; margin-bottom:16px; }
  h1 { font-size:66px; line-height:1.14; letter-spacing:-.01em; margin-bottom:18px; }
  .sub { font-size:22px; color:#e0e7ff; line-height:1.55; }
  .before-after { position:absolute; right:56px; top:132px; width:400px; height:330px; }
  .photo { position:absolute; border-radius:18px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.4);
    border:5px solid rgba(255,255,255,.92); }
  .photo img { display:block; width:100%; height:100%; object-fit:cover; }
  .photo.before { width:230px; height:158px; left:0; top:40px; transform:rotate(-7deg); }
  .photo.after { width:250px; height:172px; left:130px; top:104px; transform:rotate(4deg); }
  .tag { position:absolute; font-size:13px; font-weight:800; color:#fff; background:rgba(17,24,39,.72);
    border-radius:999px; padding:5px 14px; letter-spacing:.04em; }
  .tag.b { left:18px; top:150px; transform:rotate(-7deg); }
  .tag.a { left:296px; top:262px; transform:rotate(4deg); background:rgba(79,70,229,.9); }
  .foot { position:absolute; bottom:46px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between; }
  .chips { display:flex; gap:12px; }
  .chip { font-size:16px; font-weight:600; color:#fff; background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:9px 22px; }
  .domain { font-size:21px; font-weight:700; color:#c7d2fe; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="brand">
    <span class="mark">A</span>

    <p class="sub">瑜壊銆佹硾榛勩€佸垝鐥曘€佹ā绯娾€斺€?br>鏈湴鍗虫椂淇锛孉I 娣卞害澧炲己</p>
  </div>

  <div class="before-after">
    <div class="photo before"><img src="file:///D:/鐪熺殑娓告垙/aixuno-restore/public/examples/example-1-before.jpg"></div>
    <div class="photo after"><img src="file:///D:/鐪熺殑娓告垙/aixuno-restore/public/examples/example-1-after.jpg"></div>
    <span class="tag b">BEFORE</span>
    <span class="tag a">AFTER</span>
  </div>

  <div class="foot">
    <div class="chips">
      <span class="chip">鍏嶈垂浣跨敤</span>
      <span class="chip">鏃犻渶娉ㄥ唽</span>
      <span class="chip">AI 浜鸿劯澧炲己 路 瓒呭垎</span>
    </div>
    <span class="domain">restore.aixuno.com</span>
  </div>
</body>
</html>
